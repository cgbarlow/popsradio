<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Pop's Radios passing a message across a town with the internet down</title>
<desc id="d">Eleven houses on a simple map, each with a small green radio. Dashed lines join radios that can hear each other. An orange line carries the message I'm OK from Pop's house to Chris's house in three hops through two neighbours' radios. A phone mast and a cloud at the top are crossed out.</desc>
