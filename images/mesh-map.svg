<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Pop's Radios passing a message across a town with the internet down</title>
<desc id="d">Eleven houses on a simple map, each with a small green radio in front. Dashed lines join radios that are in range of each other. An orange line carries the message On my way from Chris's house to Pop's house in three hops, through two neighbours' radios, where it shows on Pop's radio. A cloud at the top is crossed out, marked Internet down.</desc>
